MAIL_TEXT="<p>Сізді Jitsi конференциясына шақырды. Егер сіз жиналысқа қатысқыңыз келсе, төмендегі батырманы басыңыз. < br> сақ болыңыз, қажетсіз жағдайларды болдырмау үшін пошта жөнелтушісін екі рет тексеріңіз</p>"
MAIL_TITLE="Сізді Джитси Жиналысына шақырды"
JOIN_BTN="Қосылу"
