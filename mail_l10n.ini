MAIL_TEXT="<p>Вам прапанавалі далучыцца да канферэнцыі Jitsi. Калі вы хочаце прыняць удзел у сустрэчы, націсніце кнопку ніжэй. <br> Будзьце ўважлівыя, двойчы праверце адпраўніка ліста, каб пазбегнуць непажаданых абставін</p>"
